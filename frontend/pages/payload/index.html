<!DOCTYPE html>
<html lang="es-AR" translate="no" data-bs-theme="dark">
<head>
  <base href="/" target="_self">
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="google" content="notranslate">
  <link rel="shortcut icon" href="../static/img/favicon.svg" />
  <title>Payloads • KING•VPN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="../static/css/styles.css">
  <link rel="stylesheet" href="../static/css/bootstrap.css">
  <link rel="stylesheet" href="../static/css/sidebar.css">
  <link rel="stylesheet" href="../static/css/header.css">

  <style>
    :root{
      /* ✅ FONDO MARRÓN (estilo KING) */
      --bg1:#7A4A10;
      --bg2:#2A1705;
      --bg3:#4B2A09;

      /* ✅ DORADOS */
      --gold:#D4AF37;
      --gold2:#FFD36A;
      --gold3:#8C6B1A;
      --gold4:#F0B92D;

      /* ✅ TEXTO CREMA */
      --text: rgba(255, 246, 214, .96);
      --text2: rgba(255, 246, 214, .88);
      --muted: rgba(255, 226, 170, .74);
      --muted2: rgba(255, 226, 170, .60);

      --radius:18px;
      --radius2:16px;

      --shadow: 0 18px 55px rgba(0,0,0,.72);
      --ring: 0 0 0 3px rgba(255,211,106,.22);
      --softGlow: 0 0 0 1px rgba(255,211,106,.18), 0 12px 28px rgba(0,0,0,.62);

      --header-safe: 46px; /* mantiene espacio para header en mobile */
    }

    html, body{ height:100%; }

    /* ✅ ANTI-BLUR GLOBAL (MOBILE SAFE) */
    body, main, .content, .card, .card-body, .container-fluid,
    .sidebar, .header, #root, #pagination{
      filter: none !important;
      -webkit-filter: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    body{
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      min-height:100vh;
      color:var(--text);

      background:
        radial-gradient(980px 560px at 18% 0%, rgba(255,211,106,.30), transparent 62%),
        radial-gradient(980px 560px at 92% 12%, rgba(212,175,55,.22), transparent 66%),
        radial-gradient(980px 620px at 50% 92%, rgba(212,175,55,.16), transparent 68%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg3) 36%, var(--bg2) 100%);
      background-attachment: fixed;

      overflow-x:hidden;
      padding-top: var(--header-safe);
    }

    /* Scrollbar (marrón/dorado) */
    *{
      scrollbar-width: thin;
      scrollbar-color: rgba(255,211,106,.55) rgba(42,23,5,.55);
    }
    *::-webkit-scrollbar{ width: 10px; height: 10px; }
    *::-webkit-scrollbar-track{ background: rgba(42,23,5,.55); border-radius: 999px; }
    *::-webkit-scrollbar-thumb{
      background: linear-gradient(180deg, rgba(255,211,106,.42), rgba(212,175,55,.78));
      border-radius: 999px;
      border: 2px solid rgba(42,23,5,.55);
    }

    main.d-flex{ min-height:100vh; justify-content:flex-start !important; align-items:stretch; }
    .container-fluid{ width:100%; max-width:none !important; }

    .content{
      padding: 16px;
      min-height: calc(100vh - var(--header-safe));
    }

    /* ✅ Card principal (panel marrón) */
    .kv-page-card{
      border-radius: calc(var(--radius) + 6px);
      background:
        radial-gradient(640px 240px at 20% 0%, rgba(255,211,106,.16), transparent 64%),
        linear-gradient(145deg, rgba(60, 35, 9, .92), rgba(18, 10, 2, .96));
      border: 1px solid rgba(255,211,106,.26) !important;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .kv-page-card::before{
      content:"";
      position:absolute;
      inset:-2px -2px auto -2px;
      height: 120px;
      background:
        radial-gradient(520px 110px at 18% 30%, rgba(255,255,255,.07), transparent 66%),
        radial-gradient(620px 110px at 72% 30%, rgba(255,211,106,.22), transparent 72%),
        linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,211,106,.10));
      pointer-events:none;
      border-bottom: 1px solid rgba(255,211,106,.16);
    }
    .kv-page-card::after{
      content:"";
      position:absolute;
      inset: 0;
      border-radius: calc(var(--radius) + 6px);
      pointer-events:none;
      box-shadow:
        inset 0 0 0 1px rgba(255,211,106,.18),
        inset 0 0 0 2px rgba(255,255,255,.02);
    }

    .kv-head{
      position:relative;
      z-index:1;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 12px;
    }

    .kv-title{
      color: var(--gold4) !important;
      letter-spacing: .20em;
      text-transform: uppercase;
      font-weight: 950;
      text-shadow: 0 10px 28px rgba(0,0,0,.60);
      margin: 0 !important;
    }

    .kv-sub{
      margin: 8px 0 0;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.35;
    }

    .kv-chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,211,106,.28);
      background:
        radial-gradient(240px 90px at 24% 28%, rgba(255,211,106,.18), transparent 64%),
        rgba(22, 12, 3, .62);
      box-shadow: var(--softGlow);
      font-weight:900;
      letter-spacing:.10em;
      text-transform:uppercase;
      font-size:.72rem;
      color: rgba(255,246,214,.92);
      white-space:nowrap;
      position:relative;
      overflow:hidden;
    }
    .kv-chip::after{
      content:"";
      position:absolute;
      top:-40%; left:-120%;
      width: 80%;
      height: 180%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
      transition: left .55s ease;
      pointer-events:none;
    }
    .kv-chip:hover::after{ left: 140%; }

    /* Grid payloads */
    .kv-grid{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
    }
    @media (max-width: 980px){
      .kv-grid{ grid-template-columns: 1fr; }
    }

    /* ✅ Cards payload más chicos */
    .kv-pcard{
      border-radius: 16px;
      background:
        radial-gradient(280px 130px at 20% 0%, rgba(255,211,106,.14), transparent 64%),
        rgba(22, 12, 3, .42);
      border: 1px solid rgba(255,211,106,.16);
      box-shadow: 0 0 0 1px rgba(255,255,255,.02), 0 16px 28px rgba(0,0,0,.48);
      position:relative;
      overflow:hidden;
      padding: 12px;
      min-height: 220px; /* ✅ compacto */
    }

    .kv-pcard::before{
      content:"";
      position:absolute; inset:0 0 auto 0; height:44px;
      background:
        radial-gradient(340px 44px at 20% 30%, rgba(255,255,255,.07), transparent 72%),
        radial-gradient(420px 44px at 70% 30%, rgba(255,211,106,.18), transparent 74%);
      border-bottom: 1px solid rgba(255,211,106,.12);
      pointer-events:none;
    }

    .kv-flag{
      position:absolute;
      top:10px; left:10px;
      padding:6px 10px;
      border-radius:999px;
      font-weight:950;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-size:.70rem;
      color:#2b1a00;
      background: linear-gradient(145deg, rgba(255,211,106,.98), rgba(212,175,55,.98));
      box-shadow: 0 12px 28px rgba(0,0,0,.45);
      border: 1px solid rgba(255,211,106,.22);
      pointer-events:none;
      z-index: 2;
    }

    .kv-actions{
      position:relative;
      z-index: 2;
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-bottom:10px;
      padding-top: 30px; /* deja lugar a la etiqueta */
      flex-wrap: wrap;
    }

    /* ✅ Botones estilo SERVIDORES + shine */
    .kv-btn{
      border-radius: 14px !important;
      border: 1px solid rgba(255,211,106,.22) !important;
      color: var(--text) !important;
      transition: transform .08s ease, box-shadow .2s ease, filter .2s ease, border-color .2s ease;
      box-shadow: 0 10px 22px rgba(0,0,0,.44);
      background:
        radial-gradient(240px 92px at 24% 28%, rgba(255,211,106,.18), transparent 64%),
        linear-gradient(145deg, rgba(88, 52, 12, .92), rgba(18, 10, 2, .96));
      font-weight: 950 !important;
      letter-spacing: .10em !important;
      text-transform: uppercase !important;
      padding: .42rem .7rem !important;
      font-size: .78rem !important;
      position: relative;
      overflow: hidden;
      display:flex !important;
      align-items:center !important;
      justify-content:center !important;
      gap:8px !important;
      white-space:nowrap !important;
    }
    .kv-btn::after{
      content:"";
      position:absolute;
      top:-40%; left:-120%;
      width: 80%;
      height: 180%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
      transition: left .55s ease;
      pointer-events:none;
    }
    .kv-btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 0 0 1px rgba(255,211,106,.16), 0 14px 30px rgba(0,0,0,.62);
      filter: brightness(1.06);
      border-color: rgba(255,211,106,.36) !important;
    }
    .kv-btn:hover::after{ left: 140%; }

    .kv-btn-gold{
      background: linear-gradient(145deg, rgba(255,211,106,.98), rgba(212,175,55,.98)) !important;
      border: none !important;
      color: rgba(0,0,0,.95) !important;
      box-shadow: 0 0 0 1px rgba(255,211,106,.35), 0 16px 36px rgba(255,211,106,.18) !important;
    }

    /* ✅ Caja payload compacta */
    .kv-box{
      position:relative;
      z-index: 2;
      width:100%;
      min-height: 130px;   /* ✅ más chico */
      max-height: 180px;   /* ✅ más chico */
      border-radius: 14px;
      border: 1px solid rgba(255,211,106,.20);
      background: rgba(22, 12, 3, .58);
      color: rgba(255,246,214,.96);
      padding: 12px;
      outline:none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: .86rem;
      line-height: 1.35;
      white-space: pre-wrap;
      resize: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    }
    .kv-box:focus{
      box-shadow: var(--ring) !important;
      border-color: rgba(255,211,106,.45) !important;
    }

    /* ✅ z-index safe */
    .sidebar{ z-index: 2005 !important; }
    .modal-backdrop{ z-index: 2000 !important; }
    .modal{ z-index: 2001 !important; }
  </style>
</head>

<body>
  <main class="d-flex">
    <%~ include("./sidebar", it) %>

    <div class="container-fluid p-0">
      <%~ include("./header", it) %>

      <div class="content pt-1 overflow-auto">
        <div class="card h-100 border border-0 shadow overflow-auto kv-page-card">
          <div class="card-body m-0" style="position:relative; z-index:1;">

            <div class="kv-head">
              <div style="min-width:0;">
                <h1 class="mt-2 h3 mb-1 kv-title">PAYLOADS</h1>
                <div class="kv-sub">Payloads listos para copiar y usar en KING•VPN</div>
              </div>
              <div class="kv-chip">
                <i class="bi bi-shield-lock-fill"></i> PANEL
              </div>
            </div>

            <div class="kv-grid">

              <!-- NORMAL -->
              <article class="kv-pcard">
                <div class="kv-flag">NORMAL</div>

                <div class="kv-actions">
                  <button class="btn kv-btn" type="button" onclick="reloadPayload('normal')">
                    <i class="bi bi-arrow-clockwise"></i> RECARGAR
                  </button>
                  <button class="btn kv-btn kv-btn-gold" type="button" onclick="copyPayload('normal')">
                    <i class="bi bi-clipboard-check"></i> COPIAR
                  </button>
                </div>

                <textarea id="payload-normal" class="kv-box" readonly></textarea>
              </article>

              <!-- ROTATE -->
              <article class="kv-pcard">
                <div class="kv-flag">ROTATE</div>

                <div class="kv-actions">
                  <button class="btn kv-btn" type="button" onclick="reloadPayload('rotate')">
                    <i class="bi bi-arrow-clockwise"></i> RECARGAR
                  </button>
                  <button class="btn kv-btn kv-btn-gold" type="button" onclick="copyPayload('rotate')">
                    <i class="bi bi-clipboard-check"></i> COPIAR
                  </button>
                </div>

                <textarea id="payload-rotate" class="kv-box" readonly></textarea>
              </article>

            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const PAYLOAD_TEXT =
`GET / HTTP/1.1[crlf]Host: TU-HOST-DE-LA-COMPANIA[crlf][crlf][split]
OPTION / HTTP/1.1[crlf]Host: REFUERZO-DE-TU-HOST[crlf][crlf]
GET /RUTA HTTP/1.1[crlf]Host: TU-DOMINIO-O-CDN[crlf]Backend: [lf]
Upgrade: websocket[crlf]Connection: Upgrade[crlf][crlf]`;

    const PAYLOADS = {
      normal: PAYLOAD_TEXT,
      rotate: PAYLOAD_TEXT
    };

    function loadPayload(key){
      const box = document.getElementById(`payload-${key}`);
      if (box) box.value = PAYLOADS[key] || '';
    }

    function reloadPayload(key){
      loadPayload(key);
    }

    async function copyPayload(key){
      const box = document.getElementById(`payload-${key}`);
      const text = (box && box.value) ? box.value : '';
      try{
        await navigator.clipboard.writeText(text);
      }catch{}
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPayload('normal');
      loadPayload('rotate');
    });
  </script>
</body>
</html>
