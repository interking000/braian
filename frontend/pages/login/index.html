<!DOCTYPE html>
<html lang="es-AR">
<head>
  <base href="/" target="_self">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="shortcut icon" href="/static/img/favicon.svg" />
  <title>KING•VPN - LOGIN</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

  <!-- ✅ Importante: dejá el meta csrf como el original -->
  <meta name="csrf-token" content="<%= it.csrfToken %>">

  <style>
    :root{
      --gold-main:#D4AF37;
      --gold-soft:#FFD36A;
      --gold-hi:#FFE7A6;
      --gold-deep:#B88A1A;
      --gold-dark:#8C6400;

      --bg1:#9A6A12;
      --bg2:#7A4F0A;
      --bg3:#5C3A06;

      --text:#FFF2C2;

      --shadow:0 25px 70px rgba(60,35,0,.75);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:16px;
      font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
      background:
        radial-gradient(900px 500px at 20% 10%, rgba(255,211,106,.35), transparent 60%),
        radial-gradient(800px 520px at 80% 20%, rgba(212,175,55,.30), transparent 65%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
      overflow:hidden;
      position:relative;
    }

    /* reflejo global */
    body::before,
    body::after{
      content:"";
      position:absolute;
      inset:-40%;
      background:linear-gradient(
        120deg,
        transparent 45%,
        rgba(255,215,120,.25) 50%,
        transparent 55%
      );
      filter:blur(18px);
      opacity:.35;
      animation:sheen 7s linear infinite;
      pointer-events:none;
    }
    body::after{ animation-duration:10s; opacity:.22; }

    @keyframes sheen{
      0%{ transform:translateX(-120%); }
      100%{ transform:translateX(120%); }
    }

    /* CARD */
    .card-king{
      width:100%;
      max-width:420px;
      border-radius:28px;
      padding:26px 24px 22px;
      background:
        radial-gradient(500px 260px at 50% 0%, rgba(255,215,120,.35), transparent 60%),
        linear-gradient(145deg, #8C6400, #5C3A06);
      box-shadow:var(--shadow);
      border:1px solid rgba(255,215,120,.35);
      position:relative;
      z-index:2;
      text-align:center;
      overflow:hidden;
    }

    /* borde interno premium */
    .card-king::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:28px;
      pointer-events:none;
      box-shadow:
        inset 0 0 0 1px rgba(255,215,120,.18),
        inset 0 0 0 2px rgba(255,255,255,.04);
      opacity:.9;
    }

    /* TITULO 3D REAL */
    .title-king{
      margin:6px 0 18px;
      position:relative;
      z-index:2;
    }

    .title-king h1{
      margin:0;
      font-size:2.25rem;
      font-weight:1000;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--gold-hi);

      text-shadow:
        0 2px 0 rgba(80,40,0,.70),
        0 4px 0 rgba(70,35,0,.60),
        0 6px 0 rgba(60,30,0,.52),
        0 10px 20px rgba(0,0,0,.55),
        0 0 18px rgba(255,231,166,.35);
    }

    /* línea elegante debajo */
    .title-king .orn{
      width:76%;
      margin:10px auto 0;
      height:2px;
      border-radius:999px;
      background:
        linear-gradient(90deg,
          transparent 0%,
          rgba(255,231,166,.20) 15%,
          rgba(255,231,166,.90) 50%,
          rgba(255,231,166,.20) 85%,
          transparent 100%
        );
      box-shadow:0 0 16px rgba(255,231,166,.25);
      position:relative;
    }

    .title-king .orn::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:10px;height:10px;
      transform:translate(-50%,-50%) rotate(45deg);
      background: linear-gradient(145deg, var(--gold-soft), var(--gold-deep));
      border:1px solid rgba(255,255,255,.15);
      border-radius:3px;
      box-shadow:0 0 14px rgba(255,215,120,.35);
    }

    /* LABELS PRO */
    .label-chip{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 12px;
      border-radius:14px;
      border:1px solid rgba(255,231,166,.32);
      background:
        radial-gradient(200px 80px at 20% 20%, rgba(255,231,166,.18), transparent 60%),
        linear-gradient(145deg, rgba(60,35,0,.38), rgba(20,10,0,.22));
      color:rgba(255,242,194,.96);
      font-weight:1000;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-size:.72rem;
      box-shadow:0 10px 25px rgba(0,0,0,.35);
      margin-bottom:8px;
    }

    /* INPUTS */
    .form-control{
      border-radius:16px;
      background:linear-gradient(145deg, #6F4A08, #4A2E05);
      border:1px solid rgba(255,215,120,.45);
      color:var(--text);
      padding:.9rem .95rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }
    .form-control::placeholder{ color:rgba(255,242,194,.55); }

    .form-control:focus{
      outline:none;
      background:
        radial-gradient(220px 90px at 20% 30%, rgba(255,215,120,.35), transparent 65%),
        linear-gradient(145deg, #7A540C, #5C3A06);
      border-color:var(--gold-soft);
      box-shadow:0 0 0 3px rgba(255,215,120,.35);
      color:#FFF;
    }

    /* BOTON LOGIN */
    .btn-gold{
      width:100%;
      margin-top:18px;
      padding:14px;
      border-radius:18px;
      border:none;
      background: linear-gradient(145deg, var(--gold-soft), var(--gold-deep));
      color:#3A2400;
      font-weight:1000;
      letter-spacing:.15em;
      text-transform:uppercase;
      box-shadow:0 14px 35px rgba(0,0,0,.55);
      transition:.2s;
      position:relative;
      overflow:hidden;
    }
    .btn-gold::before{
      content:"";
      position:absolute; inset:-2px;
      background: linear-gradient(120deg, transparent 42%, rgba(255,255,255,.26) 50%, transparent 58%);
      transform: translateX(-140%);
      opacity:.65;
      animation: btnSheen 5.6s linear infinite;
      pointer-events:none;
    }
    @keyframes btnSheen{ 0%{transform:translateX(-140%)} 100%{transform:translateX(140%)} }
    .btn-gold:hover{ filter:brightness(1.08); transform:translateY(-1px); }

    /* BOTON REGISTRO */
    .btn-register{
      display:block;
      width:100%;
      margin-top:12px;
      padding:12px 14px;
      border-radius:18px;
      text-decoration:none;
      text-align:center;
      border:1px solid rgba(255,231,166,.40);
      background:
        radial-gradient(240px 92px at 24% 28%, rgba(255,211,106,.22), transparent 64%),
        linear-gradient(145deg, rgba(30,16,0,.35), rgba(15,8,0,.22));
      color:rgba(255,242,194,.98);
      font-weight:1000;
      letter-spacing:.08em;
      box-shadow:0 12px 28px rgba(0,0,0,.40);
      transition:.2s;
      position:relative;
      overflow:hidden;
    }
    .btn-register::before{
      content:"";
      position:absolute; inset:-2px;
      background: linear-gradient(120deg, transparent 42%, rgba(255,215,120,.22) 50%, transparent 58%);
      transform: translateX(-140%);
      opacity:.75;
      animation: regSheen 6.2s linear infinite;
      pointer-events:none;
    }
    @keyframes regSheen{ 0%{transform:translateX(-140%)} 100%{transform:translateX(140%)} }
    .btn-register:hover{ transform:translateY(-1px); filter:brightness(1.06); }

    /* Spinner / inputs */
    .__spinner{ display:none; }
    .__spinner .spinner-border{ width:3.2rem; height:3.2rem; }

    .footer{
      position:absolute;
      bottom:12px;
      width:100%;
      text-align:center;
      color:rgba(255,242,194,.6);
      font-size:.85rem;
      z-index:1;
      pointer-events:none;
    }
  </style>
</head>

<body>

  <div class="card-king">
    <!-- ✅ LOGO ELIMINADO (como pediste) -->

    <div class="title-king">
      <h1>KING•VPN</h1>
      <div class="orn"></div>
    </div>

    <form role="form" action="/login" class="pt-1" novalidate>
      <!-- ✅ mantenemos hidden por compatibilidad -->
      <input type="hidden" name="csrf_token" value="<%= it.csrfToken %>">

      <div class="__spinner text-center">
        <div class="spinner-border text-light p-2 mb-2" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <div class="__inputs">
        <div class="mb-3 text-start">
          <div class="label-chip">USUARIO</div>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="usuario"
            required
          >
        </div>

        <div class="mb-2 text-start">
          <div class="label-chip">CONTRASEÑA</div>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="********"
            required
          >
        </div>

        <button type="submit" id="login" class="btn-gold">
          ENTRAR
        </button>

        <a href="/register" class="btn-register">
          Registrate si no tenés aún tu cuenta
        </a>
      </div>
    </form>
  </div>

  <div class="footer">Powered by © InterKing</div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <!-- helpers originales -->
  <script src="../static/js/utils.js"></script>

  <script>
    const showSpinner = () => {
      document.querySelector('.__spinner').style.display = 'block';
      document.querySelector('.__inputs').style.display = 'none';
    };

    const closeSpinner = () => {
      document.querySelector('.__spinner').style.display = 'none';
      document.querySelector('.__inputs').style.display = 'block';
    };

    let csrfToken = getCsrfTokenHead();

    const form = document.querySelector('form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      showSpinner();

      const formData = new FormData(form);
      const body = Object.fromEntries(formData);

      const response = await fetch(form.action, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'csrf-token': csrfToken
        },
        body: JSON.stringify(body)
      });

      const data = await response.json();

      if (data.status === 200) {
        showToastSuccess(data.message || 'Acceso concedido');
        setTimeout(() => {
          window.location.href = '/';
        }, 900);
        return;
      }

      const csrfTokenRefresh = getCsrfTokenRefresh(response);
      if (csrfTokenRefresh) csrfToken = csrfTokenRefresh;

      showToastError(data.message || 'Error al iniciar sesión');
      closeSpinner();
    });
  </script>

</body>
</html>
