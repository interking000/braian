<!DOCTYPE html>
<html lang="es-AR" translate="no" data-bs-theme="dark">
<head>
  <base href="/" target="_self">
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="shortcut icon" href="../static/img/favicon.svg" />
  <title>KING•VPN - REGISTRO</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

  <!-- ✅ Igual que el original -->
  <meta name="csrf-token" content="<%= it.csrfToken %>">

  <style>
    :root{
      /* ✅ PALETA KING (igual a SERVIDORES/PANEL/LOGIN) */
      --bg1:#7A4A10;
      --bg2:#2A1705;
      --bg3:#4B2A09;

      --panel: rgba(55, 32, 8, .92);
      --panel2: rgba(32, 18, 5, .88);

      --gold:#D4AF37;
      --gold2:#FFD36A;
      --gold3:#8C6B1A;
      --gold4:#F0B92D;

      --text: rgba(255, 246, 214, .96);
      --text2: rgba(255, 246, 214, .88);
      --muted: rgba(255, 226, 170, .74);
      --muted2: rgba(255, 226, 170, .60);

      --line: rgba(255,211,106,.22);
      --radius: 22px;

      --shadow: 0 18px 55px rgba(0,0,0,.72);
      --ring: 0 0 0 3px rgba(255,211,106,.22);
      --softGlow: 0 0 0 1px rgba(255,211,106,.18), 0 12px 28px rgba(0,0,0,.62);
      --softGlow2: 0 0 0 1px rgba(255,211,106,.14), 0 18px 40px rgba(0,0,0,.70);

      --ok: rgba(255,231,166,.95);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }

    /* ✅ ANTI-BLUR GLOBAL (MOBILE SAFE) */
    body, main, .content, .card, .card-body{
      filter:none !important;
      -webkit-filter:none !important;
      backdrop-filter:none !important;
      -webkit-backdrop-filter:none !important;
    }

    /* ✅ IMPORTANTE:
       Antes tenías overflow:hidden (sin scroll).
       Para "deslizar hacia abajo y recargar" necesitamos que exista scroll/overscroll,
       así que lo cambiamos a overflow:auto y centramos con min-height. */
    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:12px;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--text);

      background:
        radial-gradient(980px 560px at 18% 0%, rgba(255,211,106,.30), transparent 62%),
        radial-gradient(980px 560px at 92% 12%, rgba(212,175,55,.22), transparent 66%),
        radial-gradient(980px 620px at 50% 92%, rgba(212,175,55,.16), transparent 68%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg3) 36%, var(--bg2) 100%);
      background-attachment: fixed;

      overflow-y:auto;   /* ✅ permite pull/overscroll */
      overflow-x:hidden;
      position:relative;

      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;

      overscroll-behavior-y: contain; /* ✅ gesto estable */
      touch-action: pan-x pan-y;
    }

    /* Scrollbar (marrón/dorado) */
    *{
      scrollbar-width: thin;
      scrollbar-color: rgba(255,211,106,.55) rgba(42,23,5,.55);
    }
    *::-webkit-scrollbar{ width: 10px; height: 10px; }
    *::-webkit-scrollbar-track{ background: rgba(42,23,5,.55); border-radius: 999px; }
    *::-webkit-scrollbar-thumb{
      background: linear-gradient(180deg, rgba(255,211,106,.42), rgba(212,175,55,.78));
      border-radius: 999px;
      border: 2px solid rgba(42,23,5,.55);
    }

    /* ✅ brillo sutil global (como SERVIDORES/LOGIN) */
    body::before{
      content:"";
      position:absolute;
      inset:-45%;
      background: linear-gradient(120deg, transparent 44%, rgba(255,255,255,.12) 50%, transparent 56%);
      filter:blur(16px);
      opacity:.28;
      transform: translateX(-140%);
      animation: kvSheen 7.2s linear infinite;
      pointer-events:none;
    }
    @keyframes kvSheen{ 0%{transform:translateX(-140%)} 100%{transform:translateX(140%)} }

    /* bokeh premium (más chico para mobile) */
    .b1,.b2,.b3,.b4{
      position:absolute;border-radius:999px;filter:blur(80px);opacity:.12;pointer-events:none;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.14), transparent 60%),
        radial-gradient(circle at 70% 60%, rgba(255,211,106,.16), transparent 62%);
      animation: drift 30s ease-in-out infinite;
      z-index:0;
    }
    .b1{width:210px;height:210px;top:6%;left:10%;}
    .b2{width:180px;height:180px;bottom:10%;right:12%;animation-duration:34s;}
    .b3{width:220px;height:220px;top:56%;left:10%;animation-duration:38s;}
    .b4{width:170px;height:170px;top:22%;right:16%;animation-duration:30s;}
    @keyframes drift{
      0%{transform:translate3d(0,0,0);opacity:.12}
      50%{transform:translate3d(18px,12px,0);opacity:.09}
      100%{transform:translate3d(0,0,0);opacity:.12}
    }

    main{ width:100%; display:flex; justify-content:center; align-items:center; position:relative; z-index:2; }

    /* ✅ CARD (misma vibra del panel/login) */
    .card-king{
      width: min(520px, 96vw);
      border-radius: calc(var(--radius) + 6px);
      padding: 16px;
      background:
        radial-gradient(640px 240px at 20% 0%, rgba(255,211,106,.16), transparent 64%),
        linear-gradient(145deg, rgba(60, 35, 9, .92), rgba(18, 10, 2, .96));
      border: 1px solid rgba(255,211,106,.26);
      box-shadow: var(--shadow), 0 0 0 1px rgba(255,211,106,.08);
      position:relative;
      overflow:hidden;
      text-align:center;
    }
    .card-king::before{
      content:"";
      position:absolute;
      inset:-2px -2px auto -2px;
      height: 110px;
      background:
        radial-gradient(520px 110px at 18% 30%, rgba(255,255,255,.07), transparent 66%),
        radial-gradient(620px 110px at 72% 30%, rgba(255,211,106,.22), transparent 72%),
        linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,211,106,.10));
      pointer-events:none;
      border-bottom: 1px solid rgba(255,211,106,.16);
    }
    .card-king::after{
      content:"";
      position:absolute; inset:0;
      border-radius: calc(var(--radius) + 6px);
      pointer-events:none;
      box-shadow:
        inset 0 0 0 1px rgba(255,211,106,.18),
        inset 0 0 0 2px rgba(255,255,255,.02);
      opacity:.95;
    }
    .inner{ position:relative; z-index:2; }

    /* Top actions (compacto, estilo KING) */
    .top-actions{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 8px 8px 12px;
      border-bottom: 1px solid rgba(255,211,106,.16);
      margin-bottom: 10px;
    }
    .mini-note{
      margin:0;
      color: rgba(255,246,214,.90);
      font-weight: 950;
      letter-spacing:.06em;
      font-size: .78rem;
      line-height: 1.02rem;
      text-align:left;
      text-transform: uppercase;
    }
    .mini-note b{ color: rgba(255,211,106,.98); font-weight: 1000; }

    .wa-chip{
      position:relative;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:14px;
      text-decoration:none;
      border:1px solid rgba(255,211,106,.26);
      background:
        radial-gradient(240px 92px at 24% 28%, rgba(255,211,106,.14), transparent 64%),
        linear-gradient(145deg, rgba(10,10,12,.92), rgba(0,0,0,.96));
      color: rgba(255,246,214,.96);
      font-weight: 950;
      letter-spacing: .10em;
      text-transform: uppercase;
      box-shadow: 0 14px 34px rgba(0,0,0,.42);
      overflow:hidden;
      white-space:nowrap;
      transition: transform .12s ease, filter .2s ease, border-color .2s ease;
      flex:0 0 auto;
      font-size:.76rem;
    }
    .wa-chip:hover{ transform: translateY(-1px); filter:brightness(1.06); border-color: rgba(255,211,106,.40); }
    .wa-chip i{ color:#25D366; font-size:1rem; }
    .wa-chip::after{
      content:"";
      position:absolute;
      top:-40%; left:-120%;
      width: 85%;
      height: 180%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
      transition: left .55s ease;
      pointer-events:none;
    }
    .wa-chip:hover::after{ left: 140%; }

    /* Title + orn */
    .title-king{ margin: 6px 0 8px; }
    .title-king h1{
      margin:0;
      font-size:1.55rem;
      font-weight:1000;
      letter-spacing:.20em;
      text-transform:uppercase;
      color: var(--gold4);
      text-shadow: 0 10px 28px rgba(0,0,0,.60);
    }
    .title-king .orn{
      width:170px;
      margin:10px auto 0;
      height:2px;
      border-radius:999px;
      background: linear-gradient(90deg, rgba(255,211,106,0), rgba(255,211,106,.90), rgba(255,211,106,0));
      box-shadow: 0 10px 22px rgba(0,0,0,.55);
      position:relative;
    }

    /* ticker */
    .ticker{
      width:100%;
      margin: 10px auto 12px;
      position:relative;
      overflow:hidden;
      padding: 6px 0;
      border-top: 1px solid rgba(255,211,106,.12);
      border-bottom: 1px solid rgba(255,211,106,.12);
      mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
    }
    .ticker span{
      display:inline-block;
      padding-left:100%;
      white-space:nowrap;
      color: rgba(255,246,214,.76);
      font-weight: 900;
      letter-spacing:.10em;
      text-transform: uppercase;
      font-size:.68rem;
      animation: marquee 11.5s linear infinite;
    }
    @keyframes marquee{ 0%{transform:translateX(0)} 100%{transform:translateX(-100%)} }

    /* label chip */
    .label-chip{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:7px 10px;
      border-radius:12px;
      border:1px solid rgba(255,231,166,.22);
      background:
        radial-gradient(200px 80px at 20% 20%, rgba(255,231,166,.12), transparent 60%),
        rgba(22, 12, 3, .42);
      color: rgba(255,246,214,.96);
      font-weight: 900;
      letter-spacing:.12em;
      text-transform: uppercase;
      font-size:.68rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), 0 10px 18px rgba(0,0,0,.40);
      margin-bottom:6px;
    }

    /* inputs */
    .form-control{
      background: rgba(22, 12, 3, .58) !important;
      color: var(--text) !important;
      border: 1px solid rgba(255,211,106,.20) !important;
      border-radius: 14px !important;
      padding: .78rem .85rem !important;
      box-shadow: 0 0 0 1px rgba(255,255,255,.03);
      font-size:.95rem;
    }
    .form-control::placeholder{ color: var(--muted2); }
    .form-control:focus{
      box-shadow: var(--ring) !important;
      border-color: rgba(255,211,106,.40) !important;
      outline: none !important;
    }

    /* grid password/confirm */
    .row2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:8px;
    }
    @media (max-width: 520px){
      .row2{ grid-template-columns: 1fr; }
    }

    /* buttons (estilo panel/login) */
    .btn-gold{
      width:100%;
      margin-top:10px;
      padding: 13px 14px;
      border-radius: 14px !important;
      border:none !important;
      background: linear-gradient(145deg, rgba(255,211,106,.98), rgba(212,175,55,.98)) !important;
      color: rgba(0,0,0,.95) !important;
      font-weight: 950 !important;
      letter-spacing:.14em !important;
      text-transform: uppercase !important;
      box-shadow: 0 0 0 1px rgba(255,211,106,.35), 0 16px 36px rgba(255,211,106,.18);
      transition: transform .08s ease, filter .2s ease, box-shadow .2s ease;
      position:relative;
      overflow:hidden;
      font-size:.92rem;
    }
    .btn-gold::after{
      content:"";
      position:absolute;
      top:-40%; left:-120%;
      width: 80%;
      height: 180%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
      transition: left .55s ease;
      pointer-events:none;
    }
    .btn-gold:hover{
      transform: translateY(-1px);
      filter: brightness(1.06);
      box-shadow: 0 0 0 1px rgba(255,211,106,.16), 0 14px 30px rgba(0,0,0,.62);
    }
    .btn-gold:hover::after{ left: 140%; }
    .btn-gold:active{ transform: translateY(0); filter: brightness(.99); }

    .btn-login{
      display:block;
      width:100%;
      margin-top:10px;
      padding: 12px 14px;
      border-radius: 14px !important;
      text-decoration:none;
      text-align:center;
      border: 1px solid rgba(255,211,106,.26) !important;
      background:
        radial-gradient(240px 92px at 24% 28%, rgba(255,211,106,.18), transparent 64%),
        linear-gradient(145deg, rgba(88, 52, 12, .92), rgba(18, 10, 2, .96)) !important;
      color: rgba(255,246,214,.95) !important;
      font-weight: 950;
      letter-spacing: .10em;
      text-transform: uppercase;
      position:relative;
      overflow:hidden;
      box-shadow: 0 10px 22px rgba(0,0,0,.44);
      transition: transform .08s ease, filter .2s ease, box-shadow .2s ease, border-color .2s ease;
      font-size:.88rem;
    }
    .btn-login::after{
      content:"";
      position:absolute;
      top:-40%; left:-120%;
      width: 80%;
      height: 180%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
      transition: left .55s ease;
      pointer-events:none;
    }
    .btn-login:hover{
      transform: translateY(-1px);
      filter: brightness(1.06);
      box-shadow: 0 0 0 1px rgba(255,211,106,.16), 0 14px 30px rgba(0,0,0,.62);
      border-color: rgba(255,211,106,.36) !important;
    }
    .btn-login:hover::after{ left: 140%; }

    /* loader */
    .__btn_loader .spinner-border{ width:1.25rem; height:1.25rem; }

    .powered{
      position:fixed;
      bottom:10px;
      left:0; right:0;
      text-align:center;
      color:rgba(255,226,170,.62);
      font-size:.80rem;
      pointer-events:none;
      z-index:1;
    }

    /* Autofill */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus{
      -webkit-box-shadow: 0 0 0 30px rgba(22, 12, 3, .88) inset !important;
      -webkit-text-fill-color: rgba(255,246,214,.96) !important;
      caret-color: rgba(255,246,214,.96) !important;
      transition: background-color 9999s ease-in-out 0s;
    }

    /* valid effect */
    .kv-ok{
      color: var(--ok) !important;
      border-color: rgba(255,215,120,.70) !important;
      box-shadow: 0 0 0 3px rgba(255,215,120,.18) !important;
    }

    /* ✅ Pull-to-refresh indicator (custom) */
    .ptr{
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,211,106,.26);
      background:
        radial-gradient(240px 92px at 24% 28%, rgba(255,211,106,.14), transparent 64%),
        rgba(22, 12, 3, .72);
      box-shadow: var(--softGlow2);
      color: rgba(255,246,214,.95);
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: .72rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      will-change: transform, opacity;
    }
    .ptr.show{
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .ptr .dot{
      width: 8px; height: 8px;
      border-radius: 999px;
      background: rgba(255,211,106,.95);
      box-shadow: 0 0 0 2px rgba(255,211,106,.16), 0 0 18px rgba(255,211,106,.22);
    }
    .ptr .spin{
      width: 16px; height: 16px;
      border-radius: 999px;
      border: 2px solid rgba(255,211,106,.22);
      border-top-color: rgba(255,211,106,.95);
      animation: ptrSpin .9s linear infinite;
      display:none;
    }
    .ptr.loading .spin{ display:inline-block; }
    .ptr.loading .dot{ display:none; }
    @keyframes ptrSpin{ to{ transform: rotate(360deg); } }

    @media (max-width: 420px){
      .ptr{ top: 8px; }
      .title-king h1{ font-size: 1.38rem; }
    }
  </style>
</head>

<body>
  <div class="b1"></div><div class="b2"></div><div class="b3"></div><div class="b4"></div>

  <!-- ✅ Indicador propio (por si Chrome NO muestra el nativo) -->
  <div id="ptr" class="ptr" aria-hidden="true">
    <span class="dot"></span>
    <span class="spin"></span>
    <span id="ptrText">Deslizá para actualizar</span>
  </div>

  <main class="text-center">
    <div class="card-king">
      <div class="inner">

        <div class="top-actions">
          <p class="mini-note"><b>Registro</b><br>Creá tu cuenta</p>
          <a href="https://wa.me/5493765142705" class="wa-chip" target="_blank" rel="noopener">
            <i class="bi bi-whatsapp"></i> CONTACTO
          </a>
        </div>

        <div class="title-king">
          <h1>KING•VPN</h1>
          <div class="orn"></div>
        </div>

        <div class="ticker">
          <span>Conexión segura • Alta velocidad • Privacidad total • Acceso inmediato • Panel pro</span>
        </div>

        <form role="form" method="POST" novalidate>
          <input id="csrf_token" name="csrf_token" type="hidden" value="<%= it.csrfToken %>">

          <div class="d-flex flex-column text-start gap-2 __inputs" style="width:100%;">

            <div>
              <div class="label-chip">USUARIO</div>
              <input type="text" class="form-control" name="username" id="username" required placeholder="Ej: maxi_store" autocomplete="username">
            </div>

            <div class="row2">
              <div>
                <div class="label-chip">CONTRASEÑA</div>
                <input type="password" class="form-control" name="password" id="password" required placeholder="********" autocomplete="new-password">
              </div>
              <div>
                <div class="label-chip">CONFIRMAR</div>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="********" autocomplete="new-password">
              </div>
            </div>

            <div>
              <div class="label-chip">E-MAIL</div>
              <input type="email" class="form-control" id="email" name="email" required placeholder="correo@mail.com" autocomplete="email">
            </div>

          </div>

          <button type="submit" class="btn-gold">
            <div class="__btn_loader d-flex justify-content-center d-none">
              <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Cargando...</span>
              </div>
            </div>
            <span class="__btn_text">REGISTRAR</span>
          </button>
        </form>

        <a href="/login" class="btn-login" target="_self">
          Iniciá sesión si ya tenés cuenta
        </a>

      </div>
    </div>
  </main>

  <div class="powered">Powered by © InterKing</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../static/js/utils.js"></script>
  <script src="../static/js/register.js"></script>

  <script>
    // ✅ efecto "valid" simple y prolijo
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const confirmP = document.getElementById('confirm_password');

    [username, password, confirmP].forEach(field => {
      field.addEventListener('input', () => {
        if (field.value && field.value.length > 6) field.classList.add('kv-ok');
        else field.classList.remove('kv-ok');
      });
    });
  </script>

  <script>
    // =========================================================
    // ✅ Pull-to-refresh (deslizar hacia abajo para recargar)
    // Fallback REAL por JS que recarga cuando tirás hacia abajo
    // =========================================================
    (function(){
      const ptr = document.getElementById('ptr');
      const txt = document.getElementById('ptrText');

      const THRESHOLD = 110;     // px para disparar recarga
      const MAX_PULL  = 160;     // px máximo visual
      let startY = 0;
      let pulling = false;
      let loading = false;

      const setUI = (pullPx) => {
        const y = Math.min(pullPx, MAX_PULL);
        ptr.style.transform = `translateX(-50%) translateY(${Math.min(y, 70)}px)`;
        ptr.classList.add('show');

        if (pullPx >= THRESHOLD) txt.textContent = 'Soltá para actualizar';
        else txt.textContent = 'Deslizá para actualizar';
      };

      const hideUI = () => {
        ptr.classList.remove('show', 'loading');
        ptr.style.transform = 'translateX(-50%) translateY(0)';
        txt.textContent = 'Deslizá para actualizar';
      };

      const doReload = () => {
        if (loading) return;
        loading = true;
        ptr.classList.add('show','loading');
        txt.textContent = 'Actualizando...';
        setTimeout(() => window.location.reload(), 250);
      };

      window.addEventListener('touchstart', (e) => {
        if (loading) return;
        if ((window.scrollY || document.documentElement.scrollTop || 0) > 0) return;

        startY = e.touches[0].clientY;
        pulling = true;
      }, { passive:true });

      window.addEventListener('touchmove', (e) => {
        if (!pulling || loading) return;
        if ((window.scrollY || document.documentElement.scrollTop || 0) > 0) return;

        const y = e.touches[0].clientY;
        const pull = y - startY;

        if (pull > 12) setUI(pull);
        else if (pull <= 0) hideUI();
      }, { passive:true });

      window.addEventListener('touchend', () => {
        if (!pulling || loading) { pulling = false; return; }

        const currentText = (txt.textContent || '').toLowerCase();
        const should = currentText.includes('solt');

        pulling = false;

        if (should) doReload();
        else hideUI();
      }, { passive:true });

      hideUI();
    })();
  </script>
</body>
</html>
