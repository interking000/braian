<!DOCTYPE html>
<html lang="es-AR" translate="no" data-bs-theme="dark">
<head>
  <base href="/" target="_self">
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="google" content="notranslate">
  <link rel="shortcut icon" href="../static/img/favicon.svg" />
  <title>Notificaciones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="csrf-token" content="<%= it.csrfToken %>">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.css" />

  <link rel="stylesheet" href="../static/css/styles.css">
  <link rel="stylesheet" href="../static/css/bootstrap.css">
  <link rel="stylesheet" href="../static/css/sidebar.css">
  <link rel="stylesheet" href="../static/css/header.css">

  <script src="../static/js/dark_light.js"></script>
  <script src="//code.jquery.com/jquery-2.1.0.min.js"></script>

  <style>
    :root{
      /* =========================================================
         ✅ PALETA IGUAL A TU LOGIN (CAPTURA KING•VPN)
         ========================================================= */
      --bgTop:   #C79A2A;  /* dorado mostaza */
      --bgMid:   #B9891A;  /* oro medio */
      --bgDeep:  #6B4A10;  /* oro sombra */
      --bgEdge:  #3A2408;  /* borde oscuro */

      /* Panel oro oscuro */
      --panelA: rgba(120, 78, 14, .55);
      --panelB: rgba(85, 55, 10, .58);

      /* Dorados */
      --goldLine: rgba(255, 220, 140, .25);
      --goldLine2: rgba(255, 220, 140, .18);

      --goldText: #F6E2B5;
      --goldText2:#E9CF93;
      --goldBright:#FFE8B8;
      --goldAccent:#E1B85A;
      --goldDeep2:#8A5D10;

      /* Texto */
      --text: rgba(255, 236, 200, .92);
      --text2: rgba(255, 236, 200, .86);
      --muted: rgba(255, 232, 184, .72);
      --muted2: rgba(255, 232, 184, .58);

      --radius:18px;

      /* Sombras suaves */
      --shadow: 0 18px 55px rgba(20, 12, 2, .35);
      --ring: 0 0 0 3px rgba(255, 220, 140, .18);
      --softGlow: 0 0 0 1px rgba(255, 220, 140, .14), 0 12px 28px rgba(0,0,0,.25);
      --softGlow2: 0 0 0 1px rgba(255, 220, 140, .16), 0 18px 40px rgba(0,0,0,.35);

      /* Compat con tus nombres viejos */
      --bg1: var(--bgTop);
      --bg2: var(--bgEdge);
      --panel1: var(--panelA);
      --panel2: var(--panelB);

      --gold:  var(--goldAccent);
      --gold2: var(--goldBright);
      --gold3: var(--goldDeep2);
    }

    html, body{ height:100%; }

    /* ✅ Anti blur */
    body, main, .content, .card, .card-body, #grid, #pagination,
    .container-fluid, .sidebar, .header, .grid-wrap, .notif-card{
      filter:none !important;
      -webkit-filter:none !important;
      backdrop-filter:none !important;
      -webkit-backdrop-filter:none !important;
      transform:none;
    }

    body,
    body[data-bs-theme="light"],
    body[data-bs-theme="dark"]{
      min-height:100vh !important;
      color:var(--text) !important;

      /* ✅ Fondo oro cálido (login vibe) */
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(255,255,255,.12), transparent 60%),
        radial-gradient(900px 520px at 18% 0%, rgba(255,232,184,.14), transparent 62%),
        radial-gradient(900px 520px at 86% 10%, rgba(255,220,140,.10), transparent 66%),
        radial-gradient(800px 520px at 50% 92%, rgba(0,0,0,.18), transparent 65%),
        linear-gradient(180deg, var(--bgTop) 0%, var(--bgMid) 40%, var(--bgDeep) 88%, var(--bgEdge) 100%) !important;
      background-attachment: fixed !important;

      overflow-x:hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .container-fluid, main.d-flex{ background: transparent !important; }
    main.d-flex{ min-height:100vh; justify-content:center; }
    .container-fluid{ max-width: 1250px; width: 100%; }

    /* Scrollbar dorada */
    *{
      scrollbar-width: thin;
      scrollbar-color: rgba(255,220,140,.45) rgba(60,36,10,.35);
    }
    *::-webkit-scrollbar{ width: 10px; height: 10px; }
    *::-webkit-scrollbar-track{ background: rgba(60,36,10,.25); border-radius: 999px; }
    *::-webkit-scrollbar-thumb{
      background: linear-gradient(180deg, rgba(255,232,184,.35), rgba(225,184,90,.60));
      border-radius: 999px;
      border: 2px solid rgba(60,36,10,.25);
    }

    .content{
      display:flex; justify-content:center; align-items:center;
      min-height: calc(100vh - 80px);
      padding: 16px;
    }

    /* ✅ Card principal (panel oro oscuro) */
    .content > .card{
      width:100%;
      max-width:1120px;
      max-height: calc(100vh - 120px);
      border-radius: calc(var(--radius) + 8px);
      background:
        radial-gradient(680px 240px at 18% 0%, rgba(255,232,184,.08), transparent 60%),
        linear-gradient(145deg, var(--panelA), var(--panelB));
      border: 1px solid var(--goldLine) !important;
      box-shadow: var(--shadow);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .content > .card::before{
      content:"";
      position:absolute; inset:-2px -2px auto -2px; height: 120px;
      background:
        radial-gradient(520px 110px at 18% 30%, rgba(255,255,255,.06), transparent 65%),
        radial-gradient(620px 110px at 72% 30%, rgba(255,220,140,.10), transparent 70%),
        linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,220,140,.05));
      pointer-events:none;
      border-bottom: 1px solid var(--goldLine2);
    }
    .content > .card::after{
      content:"";
      position:absolute; inset:0;
      border-radius: calc(var(--radius) + 8px);
      pointer-events:none;
      box-shadow: inset 0 0 0 1px rgba(255,220,140,.12);
    }

    .card-body{ padding: 18px; position:relative; z-index:1; }

    /* =========================================================
       ✅ TITULO "NOTIFICACIONES" (placa dorada + 3D)
       ========================================================= */
    .text-gray-800{
      display:inline-block;
      padding: 12px 18px;
      border-radius: 14px;

      background:
        radial-gradient(220px 90px at 18% 30%, rgba(255,232,184,.08), transparent 60%),
        linear-gradient(180deg, rgba(100,65,14,.75), rgba(60,36,10,.80));
      border: 1px solid rgba(255,220,140,.18);
      box-shadow:
        0 14px 30px rgba(0,0,0,.28),
        inset 0 0 0 1px rgba(255,255,255,.04);

      color: var(--goldBright) !important;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 1000;

      text-shadow:
        0 2px 0 rgba(40,24,6,.75),
        0 4px 0 rgba(35,20,5,.60),
        0 7px 14px rgba(0,0,0,.45),
        0 0 14px rgba(255,232,184,.20);
      margin:0;
      position:relative;
    }

    .text-gray-800::after{
      content:"";
      position:absolute;
      left:10%;
      right:10%;
      bottom:-10px;
      height:2px;
      border-radius:999px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255,232,184,.18) 18%,
        rgba(255,232,184,.70) 50%,
        rgba(255,232,184,.18) 82%,
        transparent 100%
      );
      box-shadow: 0 0 14px rgba(255,232,184,.15);
    }
    .text-gray-800::before{
      content:"";
      position:absolute;
      left:50%;
      bottom:-15px;
      width:10px;height:10px;
      transform:translateX(-50%) rotate(45deg);
      background: linear-gradient(145deg, var(--goldBright), var(--goldAccent));
      border:1px solid rgba(255,255,255,.10);
      border-radius:3px;
      box-shadow:0 0 12px rgba(255,232,184,.18);
    }

    .muted{ color: var(--muted); }
    .tiny{ font-size: .86rem; }

    /* ✅ Botones (oro oscuro premium) */
    .btn{
      border-radius: 14px !important;
      border: 1px solid rgba(255,220,140,.16) !important;
      color: var(--text) !important;
      background:
        radial-gradient(240px 100px at 22% 30%, rgba(255,232,184,.08), transparent 62%),
        linear-gradient(180deg, rgba(100,65,14,.70), rgba(60,36,10,.78)) !important;
      box-shadow: 0 0 0 1px rgba(255,255,255,.02), 0 10px 18px rgba(0,0,0,.32);
      transition: transform .10s ease, box-shadow .2s ease, filter .2s ease, border-color .2s ease;
      font-weight: 950;
      letter-spacing:.10em;
      text-transform: uppercase;
      position: relative;
      overflow:hidden;
    }
    .btn::after{
      content:"";
      position:absolute;
      top:-40%; left:-120%;
      width: 85%;
      height: 180%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent);
      transition: left .55s ease;
      pointer-events:none;
    }
    .btn:hover{
      transform: translateY(-1px);
      filter: brightness(1.06);
      border-color: rgba(255,220,140,.24) !important;
      box-shadow: var(--softGlow2);
    }
    .btn:hover::after{ left: 140%; }
    .btn:active{ transform: translateY(0); filter: brightness(.99); }

    .btn-danger-ish{
      border-color: rgba(239,68,68,.26) !important;
      background:
        radial-gradient(140px 70px at 20% 30%, rgba(239,68,68,.12), transparent 62%),
        linear-gradient(180deg, rgba(100,65,14,.70), rgba(60,36,10,.78)) !important;
    }
    .btn-danger-ish i{ color: rgba(248,113,113,.95); }

    /* ✅ Grid container (oro oscuro) */
    .grid-wrap{
      border-radius: 18px;
      border: 1px solid rgba(255,220,140,.14);
      background: rgba(60,36,10,.30);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
      padding: 12px;
      position:relative;
    }
    .grid-wrap::after{
      content:"";
      position:absolute; inset:0;
      border-radius: 18px;
      pointer-events:none;
      box-shadow: inset 0 0 0 1px rgba(255,220,140,.10);
    }

    .notif-grid{
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      position:relative; z-index:1;
    }
    @media (max-width: 1100px){ .notif-grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 820px){ .notif-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 420px){ .notif-grid{ grid-template-columns: 1fr; } }

    /* ✅ Notif cards (panel oscuro + borde dorado) */
    .notif-card{
      border-radius: 16px;
      background:
        radial-gradient(260px 140px at 20% 0%, rgba(255,232,184,.07), transparent 60%),
        rgba(60,36,10,.42);
      border: 1px solid rgba(255,220,140,.14);
      box-shadow: 0 0 0 1px rgba(255,255,255,.02), 0 16px 28px rgba(0,0,0,.34);
      overflow:hidden;
      position: relative;
    }
    .notif-card::after{
      content:"";
      position:absolute; inset:0;
      border-radius:16px;
      pointer-events:none;
      box-shadow: inset 0 0 0 1px rgba(255,220,140,.10);
    }

    .notif-head{
      padding: 10px 12px;
      display:flex;
      align-items:flex-start;
      justify-content: space-between;
      gap: 10px;

      background:
        radial-gradient(260px 60px at 20% 30%, rgba(255,232,184,.08), transparent 62%),
        radial-gradient(320px 60px at 70% 30%, rgba(255,220,140,.06), transparent 65%),
        rgba(60,36,10,.35);
      border-bottom: 1px solid rgba(255,220,140,.12);
    }

    .notif-title{
      font-weight: 950;
      font-size: .95rem;
      letter-spacing:.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      color: rgba(255,236,200,.96);
    }
    .notif-sub{
      color: rgba(255,232,184,.72);
      font-weight: 800;
      font-size: .82rem;
      margin-top: 3px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }

    .notif-body{
      padding: 12px;
      background: rgba(60,36,10,.30);
    }
    .notif-msg{
      color: rgba(255,236,200,.90);
      font-size: .88rem;
      line-height: 1.25rem;
      min-height: 2.5rem;
    }

    .notif-meta{
      margin-top: 10px;
      color: rgba(255,232,184,.70);
      font-size: .78rem;
      display:flex;
      flex-direction: column;
      gap: 4px;
    }

    /* ✅ Pills */
    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255,220,140,.14);
      background: rgba(60,36,10,.45);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
      font-size: .70rem;
      letter-spacing:.12em;
      text-transform: uppercase;
      white-space: nowrap;
      width: fit-content;
      color: rgba(255,236,200,.88);
    }
    .pill.on{
      border-color: rgba(255,232,184,.28);
      box-shadow: 0 0 0 1px rgba(255,220,140,.10), 0 12px 26px rgba(0,0,0,.28);
    }

    /* ✅ Actions */
    .notif-actions{
      padding: 10px 12px;
      border-top: 1px solid rgba(255,220,140,.12);
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(60,36,10,.35);
    }
    .act-left{ display:flex; align-items:center; gap:10px; }
    .act-right{ display:flex; align-items:center; gap:8px; }

    .icon-btn{
      width: 42px;
      height: 36px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0;
      border-radius: 12px;
      background:
        radial-gradient(160px 70px at 30% 30%, rgba(255,232,184,.08), transparent 65%),
        rgba(60,36,10,.50);
      border: 1px solid rgba(255,220,140,.14);
      box-shadow: 0 0 0 1px rgba(255,255,255,.02), 0 10px 18px rgba(0,0,0,.32);
      color: var(--text);
      text-decoration:none;
      transition: transform .10s ease, filter .18s ease, box-shadow .18s ease, border-color .18s ease;
      position: relative;
      overflow:hidden;
    }
    .icon-btn::after{
      content:"";
      position:absolute;
      top:-40%; left:-120%;
      width: 85%;
      height: 180%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent);
      transition: left .55s ease;
      pointer-events:none;
    }
    .icon-btn:hover::after{ left:140%; }
    .icon-btn i{ font-size: 1.02rem; color: rgba(255,232,184,.92); }
    .icon-btn:hover{
      filter: brightness(1.06);
      transform: translateY(-1px);
      border-color: rgba(255,220,140,.24);
      box-shadow: var(--softGlow2);
    }

    /* ✅ Checkbox */
    .chk{
      width: 18px; height: 18px;
      accent-color: #E1B85A;
      transform: translateY(2px);
      cursor:pointer;
    }

    /* ===========================
       ✅ MODALES (oro oscuro)
       =========================== */
    @keyframes popIn {
      from { transform: translateY(10px) scale(.98); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }
    .modal.show .modal-dialog{ animation: popIn .18s ease-out; }

    .modal .modal-dialog{
      margin: 140px auto 1.25rem !important;
      max-width: 720px;
    }
    @media (max-width: 540px){
      .modal .modal-dialog{ margin-top: 120px !important; max-width: calc(100vw - 18px); }
    }

    .modal-backdrop{
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      filter:none !important;
    }

    .modal-content,
    .swal2-popup{
      background:
        radial-gradient(520px 220px at 18% 12%, rgba(255,232,184,.10), transparent 60%),
        radial-gradient(560px 220px at 86% 10%, rgba(255,220,140,.08), transparent 62%),
        linear-gradient(145deg, rgba(90,56,12,.65), rgba(60,36,10,.78)) !important;
      color: var(--text) !important;
      border-radius: 20px !important;
      border: 1px solid rgba(255,220,140,.16) !important;
      box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,.02) !important;
      overflow: hidden;
    }

    .modal-header, .modal-footer{
      border-color: rgba(255,220,140,.12) !important;
      background:
        linear-gradient(90deg, rgba(255,232,184,.06), rgba(60,36,10,.78), rgba(255,220,140,.06)) !important;
    }

    .modal-title{
      letter-spacing:.14em;
      text-transform: uppercase;
      font-weight: 950;
      color: var(--goldText);
      text-shadow: 0 10px 22px rgba(0,0,0,.35);
    }

    /* X dorada */
    .btn-close{
      width: 44px;
      height: 44px;
      border-radius: 14px;
      opacity: 1 !important;
      background:
        radial-gradient(120px 60px at 30% 30%, rgba(255,232,184,.10), transparent 62%),
        rgba(60,36,10,.55) !important;
      border: 1px solid rgba(255,220,140,.16) !important;
      box-shadow: 0 0 0 1px rgba(255,255,255,.02), 0 14px 26px rgba(0,0,0,.38);
      filter: none !important;
      transition: transform .10s ease, filter .18s ease, box-shadow .18s ease;
    }
    .btn-close::before{
      content:"✕";
      display:block;
      font-weight: 950;
      font-size: 16px;
      line-height: 42px;
      text-align:center;
      color: rgba(255,232,184,.95);
      text-shadow: 0 10px 24px rgba(0,0,0,.55);
    }
    .btn-close:hover{
      transform: translateY(-1px);
      filter: brightness(1.07);
      box-shadow: var(--softGlow2);
    }
    .btn-close.btn-close-white{ background-image:none !important; }

    .modal input, .modal select, .modal textarea{
      background:
        radial-gradient(220px 90px at 20% 30%, rgba(255,232,184,.06), transparent 62%),
        rgba(60,36,10,.55) !important;
      color: rgba(255,236,200,.92) !important;
      border: 1px solid rgba(255,220,140,.16) !important;
      border-radius: 12px !important;
      padding: .52rem .75rem !important;
      min-height: 42px;
      font-size: .92rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }
    .modal input:focus, .modal select:focus, .modal textarea:focus{
      border-color: rgba(255,220,140,.26) !important;
      box-shadow: var(--ring) !important;
      outline:none !important;
    }

    .modal label{
      font-size: .82rem;
      letter-spacing: .10em;
      text-transform: uppercase;
      color: rgba(255,232,184,.82);
      font-weight: 950;
      margin-bottom: 6px;
    }

    .modal-footer .btn{
      border-radius: 14px !important;
      font-weight: 950 !important;
      letter-spacing:.12em !important;
      text-transform: uppercase !important;
      padding: .68rem 1.05rem !important;
      border: 1px solid rgba(255,220,140,.16) !important;
      background:
        radial-gradient(140px 70px at 20% 30%, rgba(255,232,184,.08), transparent 62%),
        radial-gradient(180px 70px at 70% 30%, rgba(255,220,140,.06), transparent 65%),
        linear-gradient(180deg, rgba(100,65,14,.70), rgba(60,36,10,.78)) !important;
      box-shadow: var(--softGlow) !important;
    }

    /* ✅ Sidebar SIEMPRE arriba del modal */
    .sidebar{ z-index: 2005 !important; }
    .modal-backdrop{ z-index: 2000 !important; }
    .modal{ z-index: 2001 !important; }
  </style>
</head>

<body>
  <script src="//cdnjs.cloudflare.com/ajax/libs/toastr.js/2.1.4/toastr.min.js"></script>

  <main class="d-flex">
    <%~ include("./sidebar", it) %>
    <div class="container-fluid p-0">
      <%~ include("./header", it) %>

      <div class="content pt-1 overflow-auto">
        <div class="card h-100 border border-0 shadow overflow-auto">
          <div class="card-body m-0">

            <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap">
              <div>
                <h1 class="mt-2 h3 mb-2 text-gray-800">NOTIFICACIONES</h1>
                <div class="muted tiny">
                  Creá, guardá y reenviá avisos. La APK las lee por consulta (polling).
                </div>
              </div>

              <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn __btn__create">
                  <i class="bi bi-plus-lg"></i> CREAR
                </button>
                <button type="button" class="btn btn-danger-ish __btn__delete">
                  <i class="bi bi-trash3"></i> ELIMINAR
                </button>
                <button type="button" class="btn __btn__reload">
                  <i class="bi bi-arrow-repeat"></i> RECARGAR
                </button>
              </div>
            </div>

            <div class="mt-3 grid-wrap">
              <div class="d-flex align-items-center justify-content-between mb-2 gap-2 flex-wrap">
                <div class="muted tiny" id="countHint">—</div>
                <div class="muted tiny" id="selHint">0 seleccionadas</div>
              </div>

              <div id="grid" class="notif-grid"></div>
              <div id="empty" class="muted tiny" style="display:none; padding:10px;">
                Todavía no hay notificaciones guardadas.
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ===========================
       MODAL CREAR / EDITAR
       =========================== -->
  <div class="modal fade" id="notifModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title"><i class="bi bi-bell-fill"></i> NOTIFICACIÓN</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
          <input type="hidden" id="notif_id" value="">

          <div class="row g-3">
            <div class="col-md-6">
              <label>Título</label>
              <input id="title" class="form-control" maxlength="80" placeholder="MANTENIMIENTO">
            </div>
            <div class="col-md-6">
              <label>Subtítulo (opcional)</label>
              <input id="subtitle" class="form-control" maxlength="140" placeholder="Servidor en mejoras">
            </div>

            <div class="col-12">
              <label>Mensaje</label>
              <textarea id="message" class="form-control" rows="5" placeholder="Escribí el aviso..."></textarea>
            </div>

            <div class="col-md-6">
              <label>Enlace (opcional)</label>
              <input id="link" class="form-control" placeholder="https://...  o  /downloads/app.apk">
              <div class="muted tiny mt-1">Podés poner links de archivos (APK) o URLs.</div>
            </div>

            <div class="col-md-6">
              <label>Imagen (URL opcional)</label>
              <input id="image" class="form-control" placeholder="https://.../imagen.png">
            </div>

            <div class="col-md-6">
              <label>Programar envío (opcional)</label>
              <input id="scheduled_at" type="datetime-local" class="form-control">
            </div>

            <div class="col-md-6">
              <label>Estado</label>
              <select id="status" class="form-control">
                <option value="ACTIVE">ACTIVE</option>
                <option value="DISABLED">DISABLED</option>
              </select>
            </div>
          </div>
        </div>

        <div class="modal-footer border-0 d-flex justify-content-between">
          <button type="button" class="btn" data-bs-dismiss="modal">
            <i class="bi bi-x-lg"></i> CERRAR
          </button>
          <button type="button" class="btn __btn__save">
            <i class="bi bi-send"></i> GUARDAR
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../static/js/sidebar.js"></script>
  <script src="../static/js/utils.js"></script>

  <script>
    // =========================
    // CONFIG
    // =========================
    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';

    // ✅ TUS RUTAS REALES (según grep)
    const API = {
      list:   '/app_notifications/list',
      create: '/app_notifications/create',
      update: (id) => '/app_notifications/update/' + id,
      del:    (id) => '/app_notifications/delete/' + id,
    };

    const $ = (id) => document.getElementById(id);

    // Modal
    const notifModalEl = $('notifModal');
    const notifModal = new bootstrap.Modal(notifModalEl);

    // Cache
    let NOTIFS = [];
    let SELECTED = new Set();

    // =========================
    // HELPERS UI
    // =========================
    const toastOk = (m) => (window.showToastSuccess ? showToastSuccess(m) : toastr.success(m));
    const toastErr = (m) => (window.showToastError ? showToastError(m) : toastr.error(m));

    const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    }[m]));

    const shorten = (s, n) => {
      const t = String(s ?? '');
      if (t.length <= n) return t;
      return t.slice(0, n - 1) + '…';
    };

    const fmt = (iso) => {
      if (!iso) return '';
      try { return new Date(iso).toLocaleString(); } catch { return String(iso); }
    };

    function setCount() {
      $('countHint').textContent = `${NOTIFS.length} guardadas`;
      $('selHint').textContent = `${SELECTED.size} seleccionadas`;
    }

    function clearModalForm() {
      $('notif_id').value = '';
      $('title').value = '';
      $('subtitle').value = '';
      $('message').value = '';
      $('link').value = '';
      $('image').value = '';
      $('scheduled_at').value = '';
      $('status').value = 'ACTIVE';
    }

    function isoFromDatetimeLocal(val) {
      if (!val) return null;
      const d = new Date(val);
      if (Number.isNaN(d.getTime())) return null;
      return d.toISOString();
    }

    function datetimeLocalFromIso(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      const pad = (x) => String(x).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // =========================
    // RENDER GRID
    // =========================
    function renderGrid() {
      const grid = $('grid');
      const empty = $('empty');

      if (!NOTIFS.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        setCount();
        return;
      }
      empty.style.display = 'none';

      grid.innerHTML = NOTIFS.map(n => {
        const checked = SELECTED.has(n.id) ? 'checked' : '';
        const pillOn = (n.status || 'ACTIVE') === 'ACTIVE' ? 'pill on' : 'pill';
        const scheduled = n.scheduled_at ? `Programada: ${fmt(n.scheduled_at)}` : 'Sin programación';

        return `
          <div class="notif-card" data-id="${n.id}">
            <div class="notif-head">
              <div style="min-width:0">
                <div class="notif-title">${escapeHtml(n.title || '—')}</div>
                ${n.subtitle ? `<div class="notif-sub">${escapeHtml(n.subtitle)}</div>` : ``}
              </div>
              <label class="d-flex align-items-center gap-2" style="user-select:none;">
                <input class="chk __sel" type="checkbox" data-id="${n.id}" ${checked}>
              </label>
            </div>

            <div class="notif-body">
              <div class="notif-msg">${escapeHtml(shorten(n.message || '', 180))}</div>

              <div class="notif-meta">
                <span class="${pillOn}"><i class="bi bi-activity"></i> ${escapeHtml(n.status || 'ACTIVE')}</span>
                <span class="pill"><i class="bi bi-clock"></i> ${escapeHtml(scheduled)}</span>
                <span class="pill"><i class="bi bi-calendar2"></i> ${escapeHtml(fmt(n.created_at) || '')}</span>
                ${n.link ? `<span class="pill"><i class="bi bi-link-45deg"></i> LINK</span>` : ``}
                ${n.image ? `<span class="pill"><i class="bi bi-image"></i> IMG</span>` : ``}
              </div>
            </div>

            <div class="notif-actions">
              <div class="act-left">
                <button class="icon-btn __edit" type="button" title="Editar" data-id="${n.id}">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="icon-btn __resend" type="button" title="Reenviar (duplica)" data-id="${n.id}">
                  <i class="bi bi-arrow-repeat"></i>
                </button>
              </div>

              <div class="act-right">
                ${n.link ? `<a class="icon-btn" href="${escapeHtml(n.link)}" target="_blank" rel="noopener" title="Abrir link"><i class="bi bi-box-arrow-up-right"></i></a>` : ``}
              </div>
            </div>
          </div>
        `;
      }).join('');

      setCount();
    }

    // =========================
    // API CALLS
    // =========================
    async function apiJson(url, opts = {}) {
      const res = await fetch(url, opts);
      const ct = (res.headers.get('content-type') || '').toLowerCase();
      const data = ct.includes('application/json') ? await res.json().catch(() => null) : await res.text().catch(() => null);
      return { ok: res.ok, status: res.status, data };
    }

    async function loadList() {
      const grid = $('grid');
      grid.innerHTML = `<div class="muted tiny" style="padding:10px;">Cargando...</div>`;
      $('empty').style.display = 'none';

      const r = await apiJson(API.list, { method:'GET' });
      if (!r.ok) {
        console.error('list error', r);
        grid.innerHTML = `<div class="text-danger tiny" style="padding:10px;">Error cargando lista (${r.status}).</div>`;
        NOTIFS = [];
        SELECTED.clear();
        setCount();
        return;
      }

      const rows =
        Array.isArray(r.data) ? r.data :
        (r.data && Array.isArray(r.data.result)) ? r.data.result :
        (r.data && Array.isArray(r.data.data)) ? r.data.data :
        [];

      NOTIFS = rows.map(x => ({
        id: x.id,
        title: x.title,
        subtitle: x.subtitle,
        message: x.message,
        link: x.link,
        image: x.image,
        scheduled_at: x.scheduled_at,
        status: x.status || 'ACTIVE',
        created_at: x.created_at,
        updated_at: x.updated_at,
      }));

      const ids = new Set(NOTIFS.map(n => n.id));
      SELECTED = new Set([...SELECTED].filter(id => ids.has(id)));

      renderGrid();
    }

    async function createOrUpdate() {
      const id = String($('notif_id').value || '').trim();

      const title = String($('title').value || '').trim();
      const subtitle = String($('subtitle').value || '').trim();
      const message = String($('message').value || '').trim();
      const link = String($('link').value || '').trim();
      const image = String($('image').value || '').trim();
      const scheduledLocal = String($('scheduled_at').value || '').trim();
      const status = String($('status').value || 'ACTIVE').trim();

      if (!title) return toastErr('Título requerido');
      if (!message) return toastErr('Mensaje requerido');

      const payload = {
        title,
        subtitle: subtitle ? subtitle : null,
        message,
        link: link ? link : null,
        image: image ? image : null,
        scheduled_at: scheduledLocal ? isoFromDatetimeLocal(scheduledLocal) : null,
        status,
      };

      const url = id ? API.update(id) : API.create;
      const method = id ? 'PUT' : 'POST';

      const r = await apiJson(url, {
        method,
        headers: {
          'Content-Type':'application/json',
          'csrf-token': csrfToken,
        },
        body: JSON.stringify(payload),
      });

      if (!r.ok) {
        console.error('save error', r);
        return toastErr((r.data && r.data.message) ? r.data.message : 'Error guardando notificación');
      }

      toastOk(id ? 'Notificación actualizada' : 'Notificación creada');
      notifModal.hide();
      clearModalForm();
      await loadList();
    }

    async function resendDuplicate(id) {
      const n = NOTIFS.find(x => String(x.id) === String(id));
      if (!n) return;

      const payload = {
        title: n.title,
        subtitle: n.subtitle || null,
        message: n.message,
        link: n.link || null,
        image: n.image || null,
        scheduled_at: null,
        status: 'ACTIVE',
      };

      const r = await apiJson(API.create, {
        method: 'POST',
        headers: {
          'Content-Type':'application/json',
          'csrf-token': csrfToken,
        },
        body: JSON.stringify(payload),
      });

      if (!r.ok) {
        console.error('resend error', r);
        return toastErr('Error reenviando');
      }

      toastOk('Reenviado (se creó una nueva)');
      await loadList();
    }

    async function deleteSelected() {
      const ids = [...SELECTED];
      if (!ids.length) return toastErr('No seleccionaste nada');

      const conf = await Swal.fire({
        icon: 'warning',
        title: 'Eliminar',
        text: `Vas a eliminar ${ids.length} notificación(es).`,
        showCancelButton: true,
        confirmButtonText: 'Eliminar',
        cancelButtonText: 'Cancelar',
      });

      if (!conf.isConfirmed) return;

      for (const id of ids) {
        const r = await apiJson(API.del(id), {
          method: 'DELETE',
          headers: { 'csrf-token': csrfToken },
        });
        if (!r.ok) {
          console.error('delete error', id, r);
          toastErr('Error eliminando id ' + id);
          break;
        }
      }

      toastOk('Eliminadas');
      SELECTED.clear();
      await loadList();
    }

    // =========================
    // EVENTS
    // =========================
    document.querySelector('.__btn__create').addEventListener('click', () => {
      clearModalForm();
      notifModal.show();
    });

    document.querySelector('.__btn__delete').addEventListener('click', deleteSelected);
    document.querySelector('.__btn__reload').addEventListener('click', loadList);
    document.querySelector('.__btn__save').addEventListener('click', createOrUpdate);

    document.addEventListener('click', (e) => {
      const sel = e.target.closest('input.__sel');
      if (sel) {
        const id = Number(sel.getAttribute('data-id'));
        if (!Number.isFinite(id)) return;
        if (sel.checked) SELECTED.add(id); else SELECTED.delete(id);
        setCount();
        return;
      }

      const editBtn = e.target.closest('button.__edit');
      if (editBtn) {
        const id = editBtn.getAttribute('data-id');
        const n = NOTIFS.find(x => String(x.id) === String(id));
        if (!n) return;

        $('notif_id').value = String(n.id);
        $('title').value = n.title || '';
        $('subtitle').value = n.subtitle || '';
        $('message').value = n.message || '';
        $('link').value = n.link || '';
        $('image').value = n.image || '';
        $('scheduled_at').value = datetimeLocalFromIso(n.scheduled_at);
        $('status').value = n.status || 'ACTIVE';

        notifModal.show();
        return;
      }

      const resendBtn = e.target.closest('button.__resend');
      if (resendBtn) {
        const id = resendBtn.getAttribute('data-id');
        resendDuplicate(id);
        return;
      }
    });

    (function enablePullToRefresh(){
      const scroller = document.querySelector('.content > .card');
      if (!scroller) return;

      let startY = 0;
      let pulling = false;

      const start = (e) => {
        if (scroller.scrollTop > 0) return;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        pulling = true;
      };

      const move = (e) => {
        if (!pulling) return;
        if (scroller.scrollTop > 0) { pulling = false; return; }
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        const dy = y - startY;
        if (dy > 120) {
          pulling = false;
          loadList();
        }
      };

      const end = () => pulling = false;

      scroller.addEventListener('touchstart', start, { passive:true });
      scroller.addEventListener('touchmove', move, { passive:true });
      scroller.addEventListener('touchend', end, { passive:true });
    })();

    loadList();
  </script>
</body>
</html>
